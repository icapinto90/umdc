<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=block" rel="stylesheet">
<style>
@font-face{font-family:Condor;src:url(../../public/fonts/Condor-Medium.otf)}
@font-face{font-family:Plex;src:url(../../public/fonts/IBMPlexMono-Medium.woff2);font-weight:500}
@font-face{font-family:Plex;src:url(../../public/fonts/IBMPlexMono-Regular.woff2);font-weight:400}
*{box-sizing:border-box}
html,body{margin:0;width:2048px;height:2048px;overflow:hidden;background:#fff}
.page{position:relative;width:2048px;height:2048px;overflow:hidden;font-family:Plex,monospace;color:#1d2a6b}
/* le ciel, lavande et laiteux comme une impression des années 90 */
.sky{position:absolute;left:0;top:0;width:1720px;height:2048px;background:url(../../public/textures/sky-blue-8k.jpg) 52% 0/auto 2300px no-repeat;filter:saturate(.55) hue-rotate(18deg) brightness(1.12) contrast(.92)}
.wash{position:absolute;left:0;top:0;width:1720px;height:2048px;background:linear-gradient(180deg,rgba(214,214,250,.25),rgba(255,255,255,0) 40%,rgba(238,236,255,.55) 78%,rgba(255,255,255,.9))}
.staff{position:absolute;left:0;top:0;width:1720px;height:2048px;opacity:.55}
.collier{position:absolute;left:330px;top:250px;height:1500px;transform:rotate(-9deg);filter:saturate(.85) contrast(1.05) drop-shadow(0 0 40px rgba(255,255,255,.85)) drop-shadow(0 20px 30px rgba(40,50,120,.25))}
.tint{position:absolute;left:330px;top:250px;height:1500px;transform:rotate(-9deg);mix-blend-mode:color;opacity:.28;filter:brightness(0) invert(1) sepia(1) hue-rotate(195deg) saturate(4)}
.mast{position:absolute;left:150px;top:190px;width:1000px}
.mast-side{position:absolute;left:1050px;top:96px;width:380px;display:flex;flex-direction:column;gap:14px;align-items:flex-end;text-align:right}
.micro{font-weight:500;font-size:30px;letter-spacing:.14em;text-transform:uppercase}
.kata-s{font-family:"Noto Sans CJK JP";font-weight:700;font-size:34px;letter-spacing:.08em}
.script{position:absolute;left:70px;top:860px;font-family:"Mrs Saint Delafield",cursive;font-size:235px;line-height:1;color:#fff;transform:rotate(-10deg);text-shadow:0 0 18px rgba(255,255,255,.9),0 0 50px rgba(150,160,255,.7);white-space:nowrap}
.outline{position:absolute;left:110px;top:1150px;font-family:Condor,sans-serif;font-size:84px;letter-spacing:.08em;color:transparent;-webkit-text-stroke:3px #fff;text-shadow:0 0 30px rgba(120,130,230,.35);white-space:nowrap}
.kata-l{position:absolute;left:120px;top:1280px;font-family:"Noto Sans CJK JP";font-weight:500;font-size:48px;letter-spacing:.32em;color:#fff;text-shadow:0 0 14px rgba(60,70,170,.6)}
.block{position:absolute;left:150px;bottom:190px;display:flex;flex-direction:column;gap:8px;font-size:30px;line-height:38px;color:#1d2a6b}
.block b{font-family:Condor,sans-serif;font-weight:500;font-size:64px;line-height:64px;letter-spacing:.04em}
.code{position:absolute;right:190px;bottom:190px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;padding:18px 22px 12px}
.spark{position:absolute;color:#fff;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 24px rgba(170,180,255,.9))}
.main{position:absolute;left:470px;top:0;width:1578px;height:2048px;overflow:hidden}
.left{position:absolute;left:0;top:0;width:470px;height:2048px;background:#fbfaf7}
.grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:multiply}
/* l'obi : la bande de papier sur le côté */
.obi{position:absolute;right:0;top:0;width:330px;height:2048px;background:#fbfaf7;box-shadow:-10px 0 24px rgba(30,40,90,.28);display:flex;flex-direction:column;align-items:center}
.obi-top{flex:none;width:100%;height:250px;background:#1b7aa2;display:flex;align-items:center;justify-content:center}
.obi-top img{width:250px;filter:brightness(0) invert(1)}
.obi-v{writing-mode:vertical-rl;white-space:nowrap;font-family:"Noto Serif CJK JP";font-weight:900;flex:none;font-size:118px;letter-spacing:.03em;color:#1d2a6b;margin-top:60px;line-height:1}
.obi-v2{writing-mode:vertical-rl;white-space:nowrap;font-family:"Noto Sans CJK JP";font-weight:700;flex:none;font-size:34px;letter-spacing:.06em;color:#1b7aa2;margin-top:34px}
.obi-rule{flex:none;width:200px;height:6px;background:#1d2a6b;margin-top:44px}
.obi-foot{flex:none;margin-top:auto;width:100%;height:150px;background:#1d2a6b;color:#fff;display:flex;align-items:center;justify-content:center}
</style></head><body><div class="page"><div class="main">
<div class="sky"></div><div class="wash"></div>
<svg class="staff" viewBox="0 0 1720 2048" fill="none" stroke="#fff" stroke-width="3">
  <g transform="rotate(-10 860 1000)">
    <path d="M-40 560 C 400 520, 900 640, 1800 560"/><path d="M-40 590 C 400 550, 900 670, 1800 590"/><path d="M-40 620 C 400 580, 900 700, 1800 620"/><path d="M-40 650 C 400 610, 900 730, 1800 650"/><path d="M-40 680 C 400 640, 900 760, 1800 680"/>
    <g fill="#fff" stroke="none"><ellipse cx="230" cy="600" rx="17" ry="12"/><ellipse cx="390" cy="586" rx="17" ry="12"/><ellipse cx="1180" cy="640" rx="17" ry="12"/><ellipse cx="1330" cy="626" rx="17" ry="12"/><ellipse cx="1480" cy="610" rx="17" ry="12"/></g>
    <path d="M246 600 V500 M406 586 V486 M1196 640 V540 M1346 626 V526 M1496 610 V510 M1196 540 L1496 510"/>
  </g>
</svg>
<img class="collier" src="collier-detoure.png">
<img class="tint" src="collier-detoure.png">
<img class="mast" src="../../public/assets/logo-umdc.png">
<div class="mast-side" style="display:none"><span class="micro">NM-UMDC01</span><span class="micro">Noé Mémorable</span><span class="kata-s">ノエ・メモラブル</span></div>
<div class="script">Un monde de chalance</div>
<div class="outline">UN MONDE DE CHALANCE</div>
<div class="kata-l">アン・モンド・ドゥ・シャランス</div>
<div class="block"><b>NOÉ MÉMORABLE</b><span class="kata-s" style="font-size:36px">ノエ・メモラブル</span><span>© NOÉ MÉMORABLE · ÉDITÉ PAR UMDC</span></div>
<div class="code"><svg id="bars" width="300" height="120"></svg><span class="micro" style="font-size:24px">NM-UMDC01</span></div>
<div id="sparks"></div>
</div>
<div class="left"></div>
<svg class="grain" width="2048" height="2048"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="obi" style="display:none">
  <div class="obi-top"><img src="../../public/assets/mark-umdc.png"></div>
  <div class="obi-v">ノエ・メモラブル</div>
  <div class="obi-rule"></div>
  <div class="obi-v2">アン・モンド・ドゥ・シャランス</div>
  <div class="obi-foot"><span class="micro" style="font-size:28px">NM-UMDC01</span></div>
</div>
</div>
<script>
// code-barres décoratif, déterministe
let seed = 11, x = 0, svg = '';
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
while (x < 296) { const w = 2 + Math.floor(rnd() * 3) * 2; if (rnd() > .42) svg += `<rect x="${x}" y="0" width="${w}" height="120" fill="#1d2a6b"/>`; x += w; }
document.getElementById('bars').innerHTML = svg;
// éclats : étoiles à quatre branches
const star = (s) => `<svg width="${s}" height="${s}" viewBox="-50 -50 100 100"><path d="M0-50 C4-8 8-4 50 0 C8 4 4 8 0 50 C-4 8-8 4-50 0 C-8-4-4-8 0-50Z" fill="#fff"/></svg>`;
[[560,420,90],[1180,360,60],[1400,980,120],[300,1480,70],[980,1560,95],[760,300,40],[1500,1420,50],[180,700,55],[1250,1240,45],[640,1120,36]]
  .forEach(([l,t,s]) => { const d = document.createElement('div'); d.className = 'spark'; d.style.left = l + 'px'; d.style.top = t + 'px'; d.innerHTML = star(s); document.getElementById('sparks').append(d); });
document.fonts.ready.then(() => setTimeout(() => { window.ready = true; }, 800));
</script></body></html>
